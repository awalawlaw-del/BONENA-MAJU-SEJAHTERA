const K='bms_demo2',$=id=>document.getElementById(id);
const hari=(d=new Date())=>d.toLocaleDateString('sv'),jam=()=>new Date().toTimeString().slice(0,5);

 const S={users:[
  {id:'admin',n:'Pemilik (Admin)',role:'admin',pw:'admin123'},
  {id:'siti',n:'Siti Aminah',role:'kasir',pw:'siti123'},
  {id:'budi',n:'Budi Santoso',role:'karyawan',pw:'budi123'},
  {id:'dewi',n:'Dewi Lestari',role:'karyawan'},{id:'ayu',n:'Ayu Pratiwi',role:'karyawan'},{id:'rina',n:'Rina Wulandari',role:'keuangan'}],

  orders:[],fin:[],att:[],nilai:{},shifts:[{id:1,n:'Shift 1',k:'Pagi',m:'07:00',s:'15:00'},{id:2,n:'Shift 2',k:'Siang',m:'15:00',s:'23:00'},{id:3,n:'Shift 3',k:'Malam',m:'23:00',s:'07:00'}],jadwal:{},rek:'BCA 123-456-7890 a.n. Bonena Maju Sejahtera',
  outlets:[{id:1,n:'BMS Pusat',lat:-6.2088,lng:106.8456,r:200},{id:2,n:'BMS Cabang 2',lat:-6.9175,lng:107.6191,r:200}],
  assets:[{id:1,n:'Kulkas 2 Pintu',kat:'Elektronik',tgl:'2025-01-10',harga:8500000,umur:8,kond:'Baik',lok:'Dapur'},{id:2,n:'Kompor Gas 3 Tungku',kat:'Peralatan Masak',tgl:'2024-06-01',harga:3200000,umur:5,kond:'Baik',lok:'Dapur'},{id:3,n:'Meja Makan (10 set)',kat:'Furnitur',tgl:'2024-01-15',harga:12000000,umur:10,kond:'Baik',lok:'Ruang Makan'},{id:4,n:'Mesin Kasir/Printer',kat:'Elektronik',tgl:'2025-05-20',harga:2500000,umur:4,kond:'Perlu Servis',lok:'Kasir'}]};
 for(let i=1;i<=10;i++){const d=new Date();d.setDate(d.getDate()-i);const t=hari(d);
  S.fin.push({id:'s'+i+'a',tgl:t,j:'masuk',kat:'Penjualan',ket:'Penjualan harian (demo)',jml:900000+Math.floor(Math.random()*1600000),src:'seed',met:['tunai','qris','transfer'][i%3]});
  S.fin.push({id:'s'+i+'b',tgl:t,j:'keluar',kat:['Bahan Baku','Gaji','Listrik & Air','Operasional'][i%4],ket:'Pengeluaran (demo)',jml:250000+Math.floor(Math.random()*600000),src:'seed'});
  if(d.getDay()>0)['budi','dewi','siti','ayu','rina'].forEach(u=>{const tl=Math.random()<.25;S.att.push({uid:u,tgl:t,masuk:tl?'08:1'+Math.floor(Math.random()*9):'07:5'+Math.floor(Math.random()*9),pulang:'17:00',outlet:'BMS Pusat',telat:tl})})}
 const mo=new Date();mo.setDate(mo.getDate()-((mo.getDay()+6)%7)-7);
 for(let i=0;i<21;i++){const d=new Date(mo);d.setDate(mo.getDate()+i);['siti','budi','dewi','ayu'].forEach((u,k)=>{S.jadwal[hari(d)+'|'+u]=d.getDay()==(k+1)%7?'':(Math.floor(i/7)+k)%3+1})}
 return S}
let S=JSON.parse(localStorage.getItem(K)||'null')||seed(),U=null,cur='dash',cart={},q='',met='tunai',bln=hari().slice(0,7);
const save=()=>localStorage.setItem(K,JSON.stringify(S));
const AL=['admin','kasir','keuangan','karyawan'];const NAV=[['dash','Dashboard',['admin','keuangan']],['kasir','Kasir',['admin','kasir']],['menu','Kelola Menu',['admin']],['keu','Keuangan',['admin','keuangan']],['absen','Absensi',AL],['shift','Jadwal Shift',['admin']],['rekap','Rekap & Evaluasi',['admin']],['gaji','Ekspor & Gaji',['admin','keuangan']],['aset','Aset',['admin','keuangan']]];

const KEU='<path d="M3 7h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 7V5a2 2 0 0 1 2-2h12v4"/><circle cx="16" cy="14" r="1.2"/>',KSR='<path d="M4 2v20l3-2 3 2 3-2 3 2 3-2V2l-3 2-3-2-3 2-3-2z"/><path d="M8 8h8M8 12h8"/>';
const IC={dash:'<rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/>',kasir:KSR,keu:KEU,keuangan:KEU,absen:'<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',shift:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',rekap:'<path d="M3 3v18h18"/><path d="M8 16V9M13 16V5M18 16v-4"/>',aset:'<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',logo:'<path d="M6 3v7a2 2 0 0 0 4 0V3M8 3v18M17 21V3c-2.2 1-3 4-3 7s1 4 3 4"/>',admin:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',karyawan:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 5a3 3 0 0 1 0 6M18 14c2 .6 3 2.5 3 5"/>'};
const ic=(k,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[k]||''}</svg>`;

function login(){U=null;$('app').innerHTML=`<div class="hero"><div style="max-width:860px;width:100%;text-align:center"><div class="logo" style="margin:auto;width:66px;height:66px;">${ic('logo',32)}</div><h1 style="margin:12px 0 2px">Bonena Maju Sejahtera</h1><p style="color:var(--mut);margin:0 0 26px">Sistem Manajemen Rumah Makan · Versi Demo<br>Pilih peran untuk melanjutkan</p><div class="roles">${Object.entries(ROLES).map(([k,v])=>`<div class="rc" onclick="pickRole('${k}')"><i>${ic(k,26)}</i><b>${v[1]}</b><br><small style="color:var(--mut)">${v[2]}</small></div>`).join('')}</div><div id="who"></div></div></div>`}

 $('app').innerHTML=`<div class="shell"><aside><div class="brand"><div class="logo">${ic('logo',20)}</div><div>Bonena<br><small style="color:var(--pri)">Maju Sejahtera</small></div></div>${NAV.filter(n=>n[2].includes(U.role)).map(n=>`<button class="${cur==n[0]?'on':''}" onclick="cur='${n[0]}';render()">${ic(n[0])}<span>${n[1]}</span></button>`).join('')}<div class="side-foot">Versi Demo</div></aside>
 <div class="content"><div class="top"><div><b style="font-size:17px">${NAV.find(n=>n[0]==cur)[1]}</b><small>${new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</small></div><div class="row" style="margin:0"><span class="tag">${R[1]}</span><span class="av">${U.n[0]}</span><b>${U.n}</b>${U.role=='admin'?'<button class="b s" onclick="resetDemo()">Reset Data</button>':''}<button class="b s" onclick="cart={};login()">Ganti Role</button></div></div><main id="main"></main></div></div>`;V[cur]()}

let rng=14;
Object.assign(IC,{up:'<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',down:'<path d="M3 7l6 6 4-4 8 8"/><path d="M15 17h6v-6"/>',pct:'<path d="M19 5L5 19"/><circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="17" r="2.5"/>'});
const PAL=['#2563eb','#06b6d4','#8b5cf6','#f59e0b','#f43f5e'];
const jt=v=>(v/1e6).toFixed(1)+' jt';
function donut(a){const T=sum(a,x=>x[1])||1,C=2*Math.PI*52;let o=0;

 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${[0,.25,.5,.75,1].map(f=>`<line x1="${P}" x2="${W-12}" y1="${y(mx*f)}" y2="${y(mx*f)}" stroke="#e2e8f0"/><text x="${P-8}" y="${y(mx*f)+4}" font-size="10" fill="#94a3b8" text-anchor="end">${(mx*f/1e6).toFixed(1)}jt</text>`).join('')}
 <path d="${pt('i')} L${x(days.length-1)} ${H-26} L${P} ${H-26}Z" fill="rgba(37,99,235,.12)"/><path d="${pt('i')}" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round"/><path d="${pt('o')}" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-linejoin="round"/>

 ${days.map((d,i)=>`<circle cx="${x(i)}" cy="${y(d.i)}" r="3.5" fill="#fff" stroke="#2563eb" stroke-width="2"><title>${d.t} · Masuk ${rp(d.i)}</title></circle><circle cx="${x(i)}" cy="${y(d.o)}" r="3.5" fill="#fff" stroke="#f43f5e" stroke-width="2"><title>${d.t} · Keluar ${rp(d.o)}</title></circle>`).join('')}</svg>`}

 const f=cm(bln),inc=g(f,'masuk'),out=g(f,'keluar'),pi=g(cm(pm),'masuk'),po=g(cm(pm),'keluar'),nt=S.orders.filter(o=>mon(o.tgl)==bln).length,td=hari();

 const grp=(a,k)=>{const m={};a.forEach(x=>m[k(x)]=(m[k(x)]||0)+x.jml);return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,5)};
 const tm={};S.orders.filter(o=>mon(o.tgl)==bln).forEach(o=>o.items.forEach(i=>tm[i.n]=(tm[i.n]||0)+i.q));
 const top=Object.entries(tm).sort((a,b)=>b[1]-a[1]).slice(0,5),tmx=top.length?top[0][1]:1,h=new Date().getHours();

 main(`<div class="hero2"><div><small>${new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</small><h2>Selamat ${h<11?'pagi':h<15?'siang':h<18?'sore':'malam'}, ${U.n.split(' ')[0]}</h2><p>Ringkasan performa Bonena Maju Sejahtera</p></div><div><small style="display:block;margin-bottom:4px">Periode</small><input type="month" value="${bln}" onchange="bln=this.value;V.dash()"></div></div>
 <div class="kpi">${kp('Pemasukan',rp(inc),'up','#d1fae5','#047857',dl(inc,pi),'ok')}${kp('Pengeluaran',rp(out),'down','#ffe4e6','#be123c',dl(out,po,1),'bad')}${kp('Laba Bersih',rp(inc-out),'keu','#dbeafe','#1d4ed8',dl(inc-out,pi-po))}${kp('Margin Laba',(inc?((inc-out)/inc*100).toFixed(1):0)+'%','pct','#ede9fe','#6d28d9','<div class="dl">Laba ÷ pemasukan</div>')}${kp('Transaksi Kasir',nt,'kasir','#fef3c7','#b45309','<div class="dl">Nota bulan ini</div>')}</div>

 <div class="g3"><div class="card"><h3>Pengeluaran per Kategori</h3>${donut(grp(f.filter(x=>x.j=='keluar'),x=>x.kat))}</div>

 $('cart').innerHTML=(e.map(([id,n])=>{const m=S.menu.find(x=>x.id==id);return`<div class="row" style="justify-content:space-between"><span>${m.n}<br><small>${rp(m.h)}</small></span><span><button class="b s" onclick="add(${id},-1)">−</button> ${n} <button class="b s" onclick="add(${id},1)">+</button></span></div>`}).join('')||'<small>Belum ada item. Klik menu untuk menambah.</small>')+
 `<hr style="border:0;border-top:1px solid var(--ln)"><div class="row" style="justify-content:space-between"><b>Total</b><b style="font-size:20px">${rp(t)}</b></div>

 S.orders.push(o);S.fin.push({id:o.no,tgl:o.tgl,j:'masuk',kat:'Penjualan',ket:'Nota '+o.no,jml:t,src:'kasir',met});save();cart={};nota(o);drawCart()}

 <div class="l"><b>TOTAL</b><b>${rp(o.total)}</b></div><div class="l"><span>Bayar (${o.met.toUpperCase()})</span><span>${rp(o.bayar)}</span></div><div class="l"><span>Kembali</span><span>${rp(o.kembali)}</span></div><hr><div style="text-align:center">Terima kasih, selamat menikmati </div></div>

const dist=(a,b,c,d)=>{const R=6371000,t=x=>x*Math.PI/180,h=Math.sin(t(c-a)/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(t(d-b)/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
V.absen=()=>{const my=S.att.filter(a=>a.uid==U.id).sort((a,b)=>b.tgl.localeCompare(a.tgl)),td=my.find(a=>a.tgl==hari());
 main(`<div class="card"><h2>Absensi Berbasis Lokasi</h2><p>Hari ini: <b>${td?`Masuk ${td.masuk}${td.pulang?' · Pulang '+td.pulang:' · belum pulang'}${td.telat?' <span class="bad">(terlambat)</span>':''}`:'Belum absen'}</b> · Shift: <b>${shLabel(U.id,hari())}</b></p>

 ${U.role=='admin'?`<div class="row" style="margin-top:8px"><button class="b s" onclick="setLok()">Set lokasi outlet terpilih = lokasi saya</button></div>`:''}</div>
 <div class="card"><h3>Jadwal Shift Saya (7 hari)</h3>${[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()+i);return`<div class="row" style="margin:0 0 6px"><b style="width:70px">${hari(d).slice(5)}</b>${shLabel(U.id,hari(d))}</div>`}).join('')}</div><div class="card"><h3>Riwayat Saya</h3><table><tr><th>Tanggal</th><th>Masuk</th><th>Pulang</th><th>Lokasi</th><th>Status</th></tr>${my.slice(0,20).map(a=>`<tr><td>${a.tgl}</td><td>${a.masuk}</td><td>${a.pulang||'-'}</td><td>${a.outlet}</td><td class="${a.telat?'bad':'ok'}">${a.telat?'Terlambat':'Tepat waktu'}</td></tr>`).join('')}</table></div>`)}
function getLoc(cb){if($('sim').checked)return cb(null);if(!navigator.geolocation)return alert('GPS tidak didukung');navigator.geolocation.getCurrentPosition(p=>cb(p.coords),()=>alert('Gagal membaca lokasi. Izinkan akses lokasi, atau centang simulasi.'),{enableHighAccuracy:true})}

 getLoc(c=>{if(c){const d=dist(c.latitude,c.longitude,o.lat,o.lng);if(d>o.r)return alert(`Anda berada ${Math.round(d)} m dari ${o.n}. Absen hanya bisa dalam radius ${o.r} m.`)}
  let a=S.att.find(x=>x.uid==U.id&&x.tgl==hari());
  if(tipe=='masuk'){if(a)return alert('Sudah absen masuk hari ini');S.att.push({uid:U.id,tgl:hari(),masuk:jam(),pulang:'',outlet:o.n,telat:jam()>jm(U.id,hari())})}
  else{if(!a)return alert('Belum absen masuk');a.pulang=jam()}
  save();V.absen()})}

V.rekap=()=>{const now=new Date(),isNow=bln==hari().slice(0,7),[y,m]=bln.split('-').map(Number),last=isNow?now.getDate():new Date(y,m,0).getDate();

 <div class="card"><h3>Detail Absensi Bulan Ini</h3><div style="overflow:auto;max-height:340px"><table><tr><th>Tanggal</th><th>Karyawan</th><th>Masuk</th><th>Pulang</th><th>Lokasi</th><th>Status</th></tr>
 ${S.att.filter(a=>mon(a.tgl)==bln).sort((a,b)=>b.tgl.localeCompare(a.tgl)).map(a=>`<tr><td>${a.tgl}</td><td>${S.users.find(u=>u.id==a.uid).n}</td><td>${a.masuk}</td><td>${a.pulang||'-'}</td><td>${a.outlet}</td><td class="${a.telat?'bad':'ok'}">${a.telat?'Terlambat':'Tepat'}</td></tr>`).join('')}</table></div></div>`)}
function nilai(id,k,v){const key=bln+'|'+id;S.nilai[key]=S.nilai[key]||{s:3,k:3};S.nilai[key][k]=+v;save();V.rekap()}

/* ASET */
V.aset=()=>{const bv=a=>Math.max(0,a.harga*(1-((Date.now()-new Date(a.tgl))/3.15576e10)/a.umur));
 main(`<div class="card"><h2>Kontrol Aset</h2><div class="row"><input id="an" placeholder="Nama aset"><input id="ak" placeholder="Kategori"><input id="at" type="date" value="${hari()}"><input id="ah" type="number" placeholder="Harga beli"><input id="au" type="number" placeholder="Umur (thn)" style="width:110px"><input id="al" placeholder="Lokasi"><button class="b" onclick="addAset()">Tambah</button></div></div>
 <div class="kpi"><div><small>Jumlah Aset</small><b>${S.assets.length}</b></div><div><small>Total Nilai Perolehan</small><b>${rp(sum(S.assets,a=>a.harga))}</b></div><div><small>Total Nilai Buku</small><b>${rp(sum(S.assets,bv))}</b></div><div><small>Perlu Perhatian</small><b class="bad">${S.assets.filter(a=>a.kond!='Baik').length}</b></div></div>
 <div class="card" style="overflow:auto"><table><tr><th>Aset</th><th>Kategori</th><th>Lokasi</th><th>Tgl Beli</th><th class="tr">Harga</th><th class="tr">Nilai Buku</th><th>Kondisi</th><th></th></tr>
 ${S.assets.map(a=>`<tr><td>${a.n}</td><td>${a.kat}</td><td>${a.lok}</td><td>${a.tgl}</td><td class="tr">${rp(a.harga)}</td><td class="tr">${rp(bv(a))}</td><td><select onchange="kond(${a.id},this.value)">${['Baik','Perlu Servis','Rusak','Dijual/Dihapus'].map(k=>`<option ${a.kond==k?'selected':''}>${k}</option>`).join('')}</select></td><td><button class="b r" onclick="delAset(${a.id})">×</button></td></tr>`).join('')}</table><small>Nilai buku dihitung penyusutan garis lurus.</small></div>`)}
function addAset(){if(!$('an').value||!+$('ah').value)return alert('Isi nama & harga');S.assets.push({id:Date.now(),n:$('an').value,kat:$('ak').value||'-',tgl:$('at').value,harga:+$('ah').value,umur:+$('au').value||5,kond:'Baik',lok:$('al').value||'-'});save();V.aset()}
const kond=(id,v)=>{S.assets.find(a=>a.id==id).kond=v;save();V.aset()};
const delAset=id=>{if(confirm('Hapus aset?')){S.assets=S.assets.filter(a=>a.id!=id);save();V.aset()}};
/* KELOLA MENU */
IC.menu=IC.logo;let newImg='',mf='Semua';
const thumb=(m,c='mi')=>m.img?`<img class="${c}" src="${m.img}" alt="">`:`<div class="${c} ph" style="background:${PAL[(m.id||0)%5]}">${(m.n||'?')[0].toUpperCase()}</div>`;
function readImg(f,cb){if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,360/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.78))};im.src=r.result};r.readAsDataURL(f)}
V.menu=()=>{const cats=[...new Set(S.menu.map(m=>m.k))],l=S.menu.filter(m=>mf=='Semua'||m.k==mf);
 main(`<div class="kpi"><div><small>Total Menu</small><b>${S.menu.length}</b></div><div><small>Kategori</small><b>${cats.length}</b></div><div><small>Rata-rata Harga</small><b>${rp(sum(S.menu,m=>m.h)/Math.max(1,S.menu.length))}</b></div><div><small>Tidak Tersedia</small><b class="${S.menu.some(m=>m.a===false)?'bad':''}">${S.menu.filter(m=>m.a===false).length}</b></div></div>
 <div class="card"><h2>Tambah Menu Baru</h2><div class="row"><input id="mn1" placeholder="Nama menu" style="flex:1;min-width:160px"><input id="mk1" placeholder="Kategori" list="kt" style="width:150px"><datalist id="kt">${cats.map(c=>`<option>${c}`).join('')}</datalist><input id="mh1" type="number" placeholder="Harga (Rp)" style="width:140px"><label class="lb">Pilih foto<input type="file" accept="image/*" hidden onchange="readImg(this.files[0],d=>{newImg=d;$('pv').src=d;$('pv').style.display='block'})"></label><img id="pv" style="display:none;width:42px;height:42px;border-radius:8px;object-fit:cover"><button class="b" onclick="addMenu()">Tambah Menu</button></div></div>
 <div class="row">${['Semua',...cats].map(c=>`<button class="chip ${mf==c?'on':''}" onclick="mf='${c}';V.menu()">${c}</button>`).join('')}</div>
 <div class="mg">${l.map(m=>`<div class="mc ${m.a===false?'off':''}">${thumb(m)}<input value="${m.n.replace(/"/g,'&quot;')}" onchange="eM(${m.id},'n',this.value)" style="font-weight:600"><input value="${m.k}" onchange="eM(${m.id},'k',this.value)"><input type="number" value="${m.h}" onchange="eM(${m.id},'h',+this.value)">
 <div class="row" style="margin:4px 0 0;justify-content:space-between"><label style="font-size:13px"><input type="checkbox" style="width:auto;margin:0 4px 0 0" ${m.a===false?'':'checked'} onchange="eM(${m.id},'a',this.checked)">Tersedia</label><span><label class="lb">Foto<input type="file" accept="image/*" hidden onchange="readImg(this.files[0],d=>eM(${m.id},'img',d))"></label> <button class="b r" onclick="delMenu(${m.id})">Hapus</button></span></div></div>`).join('')||'<small>Belum ada menu</small>'}</div>`)};
function addMenu(){const n=$('mn1').value.trim(),h=+$('mh1').value;if(!n||!h)return alert('Isi nama menu dan harga');S.menu.push({id:Date.now(),n,k:$('mk1').value.trim()||'Lainnya',h,img:newImg,a:true});newImg='';save();V.menu()}
function eM(id,f,v){const m=S.menu.find(x=>x.id==id);if(f=='n'&&!v.trim())return V.menu();m[f]=v;save();V.menu()}
function delMenu(id){if(confirm('Hapus menu ini?')){S.menu=S.menu.filter(m=>m.id!=id);delete cart[id];save();V.menu()}}

/* JADWAL SHIFT */
const shOf=(uid,t)=>S.shifts.find(x=>x.id==S.jadwal[t+'|'+uid]);
const jm=(uid,t)=>{const s=shOf(uid,t);return s?s.m:JAM_MASUK};
const shLabel=(uid,t)=>{const s=shOf(uid,t);return s?`${s.n} ${s.k} (${s.m}–${s.s})`:'Libur / belum dijadwalkan'};
let wk=null;
V.shift=()=>{wk=wk||(()=>{const x=new Date();x.setDate(x.getDate()-((x.getDay()+6)%7));return x})();
 const ds=[...Array(7)].map((_,i)=>{const d=new Date(wk);d.setDate(d.getDate()+i);return d}),st=S.users.filter(u=>u.role!='admin'),td=hari();
 main(`<h3>Bertugas Hari Ini</h3><div class="kpi">${S.shifts.map(s=>`<div><small>${s.n} · ${s.k} (${s.m}–${s.s})</small><b style="font-size:15px">${st.filter(u=>S.jadwal[td+'|'+u.id]==s.id).map(u=>u.n.split(' ')[0]).join(', ')||'-'}</b></div>`).join('')}</div>
 <div class="card"><div class="row"><h2 style="margin:0">Atur Jadwal Pegawai</h2><button class="b s" onclick="wk.setDate(wk.getDate()-7);V.shift()">‹</button><b>${hari(ds[0])} s/d ${hari(ds[6])}</b><button class="b s" onclick="wk.setDate(wk.getDate()+7);V.shift()">›</button></div>
 <div style="overflow:auto"><table><tr><th>Pegawai</th>${ds.map(d=>`<th>${['Min','Sen','Sel','Rab','Kam','Jum','Sab'][d.getDay()]}<br>${hari(d).slice(5)}</th>`).join('')}</tr>
 ${st.map(u=>`<tr><td><b>${u.n}</b><br><small style="color:var(--mut)">${ROLES[u.role][1]}</small></td>${ds.map(d=>{const k=hari(d)+'|'+u.id,v=S.jadwal[k]||'';return`<td><select onchange="setSh('${k}',this.value)"><option value="">Libur</option>${S.shifts.map(s=>`<option value="${s.id}" ${v==s.id?'selected':''}>${s.n} ${s.k}</option>`).join('')}</select></td>`}).join('')}</tr>`).join('')}</table></div></div>
 <div class="card"><h3>Pengaturan Shift</h3>${S.shifts.map(s=>`<div class="row"><input value="${s.n}" style="width:110px" onchange="eSh(${s.id},'n',this.value)"><input value="${s.k}" style="width:100px" onchange="eSh(${s.id},'k',this.value)"><input type="time" value="${s.m}" onchange="eSh(${s.id},'m',this.value)">–<input type="time" value="${s.s}" onchange="eSh(${s.id},'s',this.value)"><button class="b r" onclick="delSh(${s.id})">×</button></div>`).join('')}<button class="b" onclick="addSh()">+ Tambah Shift</button></div>`)};
const setSh=(k,v)=>{S.jadwal[k]=v?+v:'';save()};
const eSh=(id,f,v)=>{S.shifts.find(s=>s.id==id)[f]=v;save()};
const addSh=()=>{S.shifts.push({id:Date.now(),n:'Shift '+(S.shifts.length+1),k:'Baru',m:'09:00',s:'17:00'});save();V.shift()};
const delSh=id=>{if(confirm('Hapus shift?')){S.shifts=S.shifts.filter(s=>s.id!=id);save();V.shift()}};
/* EKSPOR & GAJI */
IC.gaji='<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/>';
S.gaji=S.gaji||{};S.adj=S.adj||{};S.hk=S.hk||26;
const tmin=s=>{const [h,m]=s.split(':').map(Number);return h*60+m};
const nf=x=>Math.round(x).toLocaleString('id-ID');
function work(a){if(!a.pulang)return{jam:0,lem:0};let d=tmin(a.pulang)-tmin(a.masuk);if(d<0)d+=1440;const s=shOf(a.uid,a.tgl);let std=480;if(s){std=tmin(s.s)-tmin(s.m);if(std<=0)std+=1440}const ex=Math.max(0,d-std);return{jam:d/60,lem:ex>=30?Math.floor(ex/30)/2:0}}
const gc=u=>Object.assign({pokok:u.role=='keuangan'?4500000:u.role=='kasir'?3800000:3500000,makan:15000,lembur:15000,telat:10000},S.gaji[u.id]||{});
function hitung(u,b){const [y,m]=b.split('-').map(Number),last=b==hari().slice(0,7)?new Date().getDate():new Date(y,m,0).getDate(),g=gc(u);
 const a=S.att.filter(x=>x.uid==u.id&&mon(x.tgl)==b),ds=new Set(a.map(x=>x.tgl));
 const ks=Object.keys(S.jadwal).filter(k=>k.endsWith('|'+u.id)&&k.startsWith(b)&&S.jadwal[k]).map(k=>k.slice(0,10)).filter(d=>+d.slice(8)<=last);
 let ne,alpa;if(ks.length){ne=ks.length;alpa=ks.filter(d=>!ds.has(d)).length}else{let w=0;for(let d=1;d<=last;d++)if(new Date(y,m-1,d).getDay()>0)w++;ne=w;alpa=Math.max(0,w-a.length)}
 const ad=Object.assign({bonus:0,pot:0},S.adj[b+'|'+u.id]||{}),rate=g.pokok/S.hk,hadir=a.length,telat=a.filter(x=>x.telat).length,lem=sum(a,x=>work(x).lem);
 const r={u,g,ne,hadir,alpa,telat,lem,rate,pA:alpa*rate,pT:telat*g.telat,mk:hadir*g.makan,lm:lem*g.lembur,bonus:ad.bonus,pl:ad.pot};
 r.total=g.pokok-r.pA-r.pT+r.mk+r.lm+r.bonus-r.pl;return r}
const stf=()=>S.users.filter(u=>u.role!='admin');
const absRows=()=>[['Tanggal','Pegawai','Peran','Shift','Masuk','Pulang','Jam Kerja','Lembur (jam)','Status','Lokasi'],...S.att.filter(a=>mon(a.tgl)==bln).sort((a,b)=>a.tgl.localeCompare(b.tgl)||a.uid.localeCompare(b.uid)).map(a=>{const u=S.users.find(x=>x.id==a.uid),w=work(a),s=shOf(a.uid,a.tgl);return[a.tgl,u.n,ROLES[u.role][1],s?s.n+' '+s.k:'-',a.masuk,a.pulang||'-',+w.jam.toFixed(2),w.lem,a.telat?'Terlambat':'Tepat waktu',a.outlet]})];
const rekRows=()=>[['Pegawai','Peran','Hari Kerja/Terjadwal','Hadir','Tidak Masuk','Terlambat','Lembur (jam)','% Hadir'],...stf().map(u=>{const h=hitung(u,bln);return[u.n,ROLES[u.role][1],h.ne,h.hadir,h.alpa,h.telat,h.lem,h.ne?Math.round(Math.min(100,h.hadir/h.ne*100))+'%':'-']})];
const gajiRows=()=>{const H=stf().map(u=>hitung(u,bln));return[['Pegawai','Peran','Hadir','Tidak Masuk','Terlambat','Lembur (jam)','Gaji Pokok','Uang Makan','Lembur','Bonus','Pot. Tidak Masuk','Pot. Telat','Pot. Lain','Estimasi Gaji Bersih'],...H.map(h=>[h.u.n,ROLES[h.u.role][1],h.hadir,h.alpa,h.telat,h.lem,h.g.pokok,h.mk,h.lm,h.bonus,Math.round(h.pA),h.pT,h.pl,Math.round(h.total)]),['TOTAL','','','','','',...[6,7,8,9,10,11,12,13].map(i=>0)].map((c,i,a)=>i<6?c:Math.round(sum(H,h=>[h.g.pokok,h.mk,h.lm,h.bonus,h.pA,h.pT,h.pl,h.total][i-6])))]};
function xl(sh,name){if(window.XLSX){const wb=XLSX.utils.book_new();sh.forEach(([n,r])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(r),n));XLSX.writeFile(wb,name+'.xlsx')}else{const r=sh[0][1].map(a=>a.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+r],{type:'text/csv'}));a.download=name+'.csv';a.click()}}
const exAbs=()=>xl([['Detail Absensi',absRows()],['Rekap Bulanan',rekRows()]],'absensi-'+bln),exGaji=()=>xl([['Estimasi Gaji',gajiRows()]],'gaji-'+bln);
const sg=(id,f,v)=>{S.gaji[id]=Object.assign(S.gaji[id]||{},{[f]:v||0});save();V.gaji()},sa=(id,f,v)=>{const k=bln+'|'+id;S.adj[k]=Object.assign(S.adj[k]||{},{[f]:v||0});save();V.gaji()};
V.gaji=()=>{const H=stf().map(u=>hitung(u,bln)),det=absRows().slice(1),inp=(v,fn)=>`<input type="number" value="${Math.round(v)}" style="width:118px" onchange="${fn}">`;
 main(`<div class="card"><div class="row" style="justify-content:space-between;margin:0"><div class="row" style="margin:0"><h2 style="margin:0">Ekspor Absensi & Estimasi Gaji</h2><input type="month" value="${bln}" onchange="bln=this.value;V.gaji()"></div><div class="row" style="margin:0"><button class="b s" onclick="exAbs()">Ekspor Absensi</button><button class="b" onclick="exGaji()">Ekspor Gaji</button></div></div>
 <p style="color:var(--mut);font-size:12px;margin:10px 0 0">Estimasi = gaji pokok − (hari tidak masuk × gaji harian) − potongan telat + uang makan + lembur + bonus − potongan lain. Gaji harian = gaji pokok ÷ ${S.hk} hari. Lembur = jam kerja melebihi durasi shift (min. 30 menit, kelipatan 0,5 jam). Tidak masuk dihitung dari jadwal shift (jika ada), selain itu Senin–Sabtu. Ekspor berformat Excel (.xlsx).</p></div>
 <div class="kpi"><div><small>Total Estimasi Gaji</small><b>${rp(sum(H,h=>h.total))}</b></div><div><small>Total Lembur</small><b>${sum(H,h=>h.lem)} jam</b></div><div><small>Total Potongan</small><b class="bad">${rp(sum(H,h=>h.pA+h.pT+h.pl))}</b></div><div><small>Pegawai</small><b>${H.length}</b></div></div>
 <div class="card"><h3>Komponen Gaji per Pegawai</h3><div class="row"><label>Hari kerja per bulan <input type="number" value="${S.hk}" style="width:80px" onchange="S.hk=+this.value||26;save();V.gaji()"></label></div><table><tr><th>Pegawai</th><th>Gaji Pokok</th><th>Uang Makan / hari hadir</th><th>Lembur / jam</th><th>Potongan Telat / kali</th></tr>${H.map(h=>`<tr><td>${h.u.n}<br><small style="color:var(--mut)">${ROLES[h.u.role][1]}</small></td><td>${inp(h.g.pokok,`sg('${h.u.id}','pokok',+this.value)`)}</td><td>${inp(h.g.makan,`sg('${h.u.id}','makan',+this.value)`)}</td><td>${inp(h.g.lembur,`sg('${h.u.id}','lembur',+this.value)`)}</td><td>${inp(h.g.telat,`sg('${h.u.id}','telat',+this.value)`)}</td></tr>`).join('')}</table></div>
 <div class="card"><h3>Estimasi Gaji ${bln} (Rp)</h3><table><tr><th>Pegawai</th><th>Hadir</th><th>Tdk Masuk</th><th>Telat</th><th>Lembur</th><th class="tr">Gaji Pokok</th><th class="tr">Uang Makan</th><th class="tr">Lembur</th><th>Bonus</th><th class="tr">Pot. Tdk Masuk</th><th class="tr">Pot. Telat</th><th>Pot. Lain</th><th class="tr">Estimasi Bersih</th><th></th></tr>
 ${H.map(h=>`<tr><td><b>${h.u.n}</b></td><td>${h.hadir}/${h.ne}</td><td class="${h.alpa?'bad':''}">${h.alpa}</td><td>${h.telat}</td><td>${h.lem} jam</td><td class="tr">${nf(h.g.pokok)}</td><td class="tr">${nf(h.mk)}</td><td class="tr ok">${nf(h.lm)}</td><td>${inp(h.bonus,`sa('${h.u.id}','bonus',+this.value)`)}</td><td class="tr bad">${nf(h.pA)}</td><td class="tr bad">${nf(h.pT)}</td><td>${inp(h.pl,`sa('${h.u.id}','pot',+this.value)`)}</td><td class="tr"><b>${nf(h.total)}</b></td><td><button class="b s" onclick="slip('${h.u.id}')">Slip</button></td></tr>`).join('')}</table></div>
 <div class="card"><h3>Rincian Absensi & Lembur</h3><table><tr><th>Tanggal</th><th>Pegawai</th><th>Shift</th><th>Masuk</th><th>Pulang</th><th>Jam Kerja</th><th>Lembur</th><th>Status</th></tr>${det.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[3]}</td><td>${r[4]}</td><td>${r[5]}</td><td>${r[6]} jam</td><td class="${r[7]?'ok':''}">${r[7]?r[7]+' jam':'-'}</td><td class="${r[8]=='Terlambat'?'bad':'ok'}">${r[8]}</td></tr>`).join('')||'<tr><td colspan=8>Belum ada data absensi bulan ini</td></tr>'}</table></div>`)};
function slip(id){const h=hitung(S.users.find(u=>u.id==id),bln),L=(a,b,c='')=>`<div class="l"><span>${a}</span><span class="${c}">${b}</span></div>`;
 modal(`<div class="nota"><div style="text-align:center"><b>BONENA MAJU SEJAHTERA</b><br>Slip Gaji (Estimasi)<hr></div>Periode: ${bln}<br>Nama: ${h.u.n}<br>Jabatan: ${ROLES[h.u.role][1]}<hr>${L('Gaji pokok',nf(h.g.pokok))}${L(`Uang makan (${h.hadir} hari)`,'+'+nf(h.mk))}${L(`Lembur (${h.lem} jam)`,'+'+nf(h.lm))}${L('Bonus','+'+nf(h.bonus))}${L(`Tidak masuk (${h.alpa} hari)`,'-'+nf(h.pA))}${L(`Terlambat (${h.telat}x)`,'-'+nf(h.pT))}${L('Potongan lain','-'+nf(h.pl))}<hr><div class="l"><b>ESTIMASI BERSIH</b><b>${rp(h.total)}</b></div><hr><div style="text-align:center">Angka ini estimasi berjalan.</div></div><div class="np" style="margin-top:12px"><button class="b" onclick="window.print()">Cetak</button> <button class="b s" onclick="closeM()">Tutup</button></div>`)}

render();
</script></body></html>
